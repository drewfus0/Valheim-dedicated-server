<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0e17" />
    </linearGradient>

    <!-- Brand Tint: Gold to Cyan Gradient -->
    <linearGradient id="brandTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.20" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85" />
    </linearGradient>

    <!-- Blade Gradients: Left (Highlight) & Right (Shadow) -->
    <linearGradient id="bladeHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="bladeShad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gold Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="shadowUnder" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background Base Box -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />
  
  <!-- Ambient Brand Tint Overlay -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brandTint)" />

  <!-- Outer Glowing Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2.2" />

  <!-- Inner Soft Bevel -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Crossed Swords -->
  <g filter="url(#shadowUnder)">
    <!-- Sword 1: Rotated -45 deg (Bottom-Left to Top-Right) -->
    <g transform="translate(32,32) rotate(-45) translate(-32,-32)">
      <!-- Blade Left Side -->
      <polygon points="32,7.5 28.5,12 29.5,37 32,37" fill="url(#bladeHigh)" />
      <!-- Blade Right Side -->
      <polygon points="32,7.5 32,37 34.5,37 35.5,12" fill="url(#bladeShad)" />
      <!-- Fuller (Blood Groove) -->
      <line x1="32" y1="12" x2="32" y2="35" stroke="#475569" stroke-width="0.9" stroke-linecap="round" />

      <!-- Guard / Hilt -->
      <path d="M 22.5,37 C 26.5,38.5 37.5,38.5 41.5,37 C 42.5,39 40.5,40.5 32,40.5 C 23.5,40.5 21.5,39 22.5,37 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.6" />

      <!-- Grip / Handle -->
      <rect x="30" y="40" width="4" height="10.5" rx="1" fill="#78350f" stroke="#451a03" stroke-width="0.5" />
      <!-- Handle Wire Wraps -->
      <line x1="30" y1="42.5" x2="34" y2="42.5" stroke="#d97706" stroke-width="0.6" />
      <line x1="30" y1="45" x2="34" y2="45" stroke="#d97706" stroke-width="0.6" />
      <line x1="30" y1="47.5" x2="34" y2="47.5" stroke="#d97706" stroke-width="0.6" />

      <!-- Pommel -->
      <circle cx="32" cy="52.5" r="3" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.6" />
      <circle cx="32" cy="52.5" r="1.2" fill="#fef08a" />
    </g>

    <!-- Sword 2: Rotated +45 deg (Top-Left to Bottom-Right) -->
    <g transform="translate(32,32) rotate(45) translate(-32,-32)">
      <!-- Blade Left Side -->
      <polygon points="32,7.5 28.5,12 29.5,37 32,37" fill="url(#bladeHigh)" />
      <!-- Blade Right Side -->
      <polygon points="32,7.5 32,37 34.5,37 35.5,12" fill="url(#bladeShad)" />
      <!-- Fuller (Blood Groove) -->
      <line x1="32" y1="12" x2="32" y2="35" stroke="#475569" stroke-width="0.9" stroke-linecap="round" />

      <!-- Guard / Hilt -->
      <path d="M 22.5,37 C 26.5,38.5 37.5,38.5 41.5,37 C 42.5,39 40.5,40.5 32,40.5 C 23.5,40.5 21.5,39 22.5,37 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.6" />

      <!-- Grip / Handle -->
      <rect x="30" y="40" width="4" height="10.5" rx="1" fill="#78350f" stroke="#451a03" stroke-width="0.5" />
      <!-- Handle Wire Wraps -->
      <line x1="30" y1="42.5" x2="34" y2="42.5" stroke="#d97706" stroke-width="0.6" />
      <line x1="30" y1="45" x2="34" y2="45" stroke="#d97706" stroke-width="0.6" />
      <line x1="30" y1="47.5" x2="34" y2="47.5" stroke="#d97706" stroke-width="0.6" />

      <!-- Pommel -->
      <circle cx="32" cy="52.5" r="3" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.6" />
      <circle cx="32" cy="52.5" r="1.2" fill="#fef08a" />
    </g>
  </g>
</svg>